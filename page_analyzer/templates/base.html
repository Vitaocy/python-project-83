<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Анализатор страниц{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('index') }}">Анализатор страниц</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('urls_get') }}">Сайты</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="flex-grow-1">

    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }} rounded-0 mb-0" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="container-lg mt-3">
        {% block content %}{% endblock %}
    </div>

</main>

<footer class="border-top py-3 mt-5 flex-shrink-0">
    <div class="container-lg text-center">
        <a href="https://ru.hexlet.io/" target="_blank">Hexlet</a>
    </div>
</footer>

</body>
</html>
