<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализатор страниц</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
  </head>
  <body class="d-flex flex-column min-vh-100">

      <!-- Навигационная панель (Header) -->
      <header>
          <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
              <div class="container-fluid">
                  <a class="navbar-brand" href="/">Анализатор страниц</a>
                  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                      <span class="navbar-toggler-icon"></span>
                  </button>
                  <div class="collapse navbar-collapse" id="navbarNav">
                      <ul class="navbar-nav">
                          <li class="nav-item">
                              <!-- Ссылка на страницу со списком сайтов -->
                              <a class="nav-link" href="/urls">Сайты</a>
                          </li>
                      </ul>
                  </div>
              </div>
          </nav>
      </header>

      <!-- Основной контент (Main) -->
      <!-- Класс flex-grow-1 заставляет этот блок занимать всё свободное место, отталкивая футер вниз -->
      <main class="flex-grow-1">
          <div class="container mt-5">
              <div class="row justify-content-center">
                  <div class="col-12 col-md-10 col-lg-8">
                      <!-- Серый блок (Jumbotron) -->
                      <div class="p-5 mb-4 bg-light border rounded-3">
                          <h1 class="display-4 mb-3">Анализатор страниц</h1>
                          <p class="lead mb-4">Бесплатно проверяйте сайты на SEO-пригодность</p>
                          
                          <form action="/urls" method="post" class="row g-2">
                            <div class="col-12 col-md flex-grow-1">
                                <input type="url" 
                                    name="url" 
                                    class="form-control form-control-lg {% if errors and errors.get('name') %}is-invalid{% endif %}" 
                                    placeholder="https://www.example.com" 
                                    value="{{ url_name | default('') }}" 
                                    required>
                                
                                {% if errors and errors.get('name') %}
                                    <div class="invalid-feedback">
                                        {{ errors['name'] }}
                                    </div>
                                {% endif %}
                            </div>
                            
                            <div class="col-12 col-md-auto">
                                <button type="submit" class="btn btn-primary btn-lg w-100">ПРОВЕРИТЬ</button>
                            </div>
                        </form>
                      </div>
                  </div>
              </div>
          </div>
      </main>

      <!-- Подвал (Footer) -->
      <footer class="border-top py-3 mt-5 flex-shrink-0">
          <div class="container text-center">
              <a href="https://ru.hexlet.io/" target="_blank">Hexlet</a>
          </div>
      </footer>

  </body>
</html>
